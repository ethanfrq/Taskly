<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskly prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#F5F5F7;--surface-1:#FFFFFF;--surface-2:#EDEDF0;--border-strong:rgba(0,0,0,.16);--bg-accent:#E6F1FB;--text-accent:#0C447C;--text-primary:#1D1D1F;--text-secondary:#5F5F64;--text-muted:#8A8A8F;--font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--surface-0:#111113;--surface-1:#1A1A1D;--surface-2:#26262A;--border-strong:rgba(255,255,255,.2);--bg-accent:#0C2A47;--text-accent:#85B7EB;--text-primary:#F2F2F4;--text-secondary:#A8A8AE;--text-muted:#7A7A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);padding:24px 16px 48px}
main{max-width:720px;margin:0 auto}
header{margin-bottom:16px}
header h1{font-size:22px;font-weight:600;margin:0 0 4px}
header p{font-size:14px;color:var(--text-secondary);margin:0;line-height:1.5}
header a{color:var(--text-accent)}
.nav-btn{border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.nav-btn:hover{background:var(--surface-2)}
.p-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start;background:var(--surface-1);border-radius:12px;padding:16px}
.p-st{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:none;background:transparent;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;font-family:inherit}
.p-st:hover{background:var(--surface-2)}
.p-st[aria-current=step],.p-st[aria-current=step]:hover{background:var(--bg-accent);color:var(--text-accent)}
.p-st span{font-size:11px;min-width:16px;color:inherit}
.p-gl{font-size:12px;color:var(--text-muted);margin:10px 8px 2px}
@media (max-width:640px){.p-wrap{grid-template-columns:minmax(0,1fr)}.p-steps{display:flex;flex-wrap:wrap;gap:4px}.p-steps .p-gl,.p-steps #p-cap{width:100%}.p-steps .p-st{width:auto;background:var(--surface-2)}}
.p-app{--acc:#007AFF;--acct:#007AFF;--onacc:#fff;--bg:#F2F2F7;--card:#fff;--tx:#000;--tx2:#6E6E73;--sep:#E5E5EA;--fill:#E3E3E8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.p-app[data-theme=dark]{--bg:#000;--card:#1C1C1E;--tx:#fff;--tx2:#98989D;--sep:#38383A;--fill:#2C2C2E}
.p-ph{width:320px;max-width:100%;height:660px;margin:0 auto;border:1px solid var(--border-strong);border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.4}
.p-sb{display:flex;justify-content:space-between;padding:12px 22px 4px;font-size:12px;font-weight:500;flex:none}
.p-body{flex:1;display:flex;flex-direction:column;padding:8px 18px 0;min-height:0;overflow:hidden}
.p-foot{padding:10px 18px 24px;display:flex;flex-direction:column;gap:6px;flex:none}
.p-lt{font-size:26px;font-weight:600;letter-spacing:-0.4px;line-height:1.15}
.p-mt{font-size:12px;color:var(--tx2)}
.p-b{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:500;background:var(--acc);color:var(--onacc);cursor:pointer;font-family:inherit;line-height:1.2}
.p-b2{background:var(--card);color:var(--acct)}
.p-lk{background:transparent;color:var(--acct);padding:6px}
.p-grp{background:var(--card);border-radius:12px;overflow:hidden}
.p-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:0.5px solid var(--sep)}
.p-row:last-child{border-bottom:none}
.p-cb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--tx2);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.p-cb.on{background:var(--acc);border-color:var(--acc)}
.p-seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.p-seg>div{flex:1;text-align:center;padding:6px 4px;font-size:12px;border-radius:7px;cursor:pointer}
.p-seg>div.on{background:var(--card);font-weight:500}
.p-tg{width:40px;height:24px;border-radius:12px;background:var(--fill);position:relative;flex:none;cursor:pointer}
.p-tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff}
.p-tg.on{background:#34C759}.p-tg.on::after{left:18px}
.p-chip{background:var(--fill);border-radius:7px;padding:3px 8px;font-size:13px}
.p-ov{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:5}
.p-dots{display:flex;gap:5px;justify-content:center;padding:4px 0 6px;flex:none}
.p-dots i{width:6px;height:6px;border-radius:3px;background:var(--sep);display:block}
.p-dots i.on{background:var(--acc);width:16px}
.p-spin{animation:pspin 1s linear infinite;display:inline-block}
@keyframes pspin{to{transform:rotate(360deg)}}
.p-tint{background:color-mix(in srgb,var(--acc) 14%,var(--card));border-radius:12px}
.p-in{width:100%;border:none;border-radius:10px;padding:11px 12px;font-size:14px;background:var(--card);color:var(--tx);font-family:inherit;outline:none}
</style>
</head>
<body>
<main>
<header>
<h1>Taskly · prototype du parcours</h1>
<p>13 écrans, de la page web au bilan du soir. Les boutons de l'écran sont cliquables et la couleur choisie à l'étape 6 reste appliquée. Décisions : <a href="DECISIONS.md">DECISIONS.md</a>.</p>
</header>
<div class="p-wrap">
<div class="p-steps">
<div class="p-gl" style="margin-top:0">Avant l'installation</div>
<button type="button" class="p-st" aria-current="step"><span>1</span>Page web</button>
<button type="button" class="p-st"><span>2</span>Installation</button>
<button type="button" class="p-st"><span>3</span>Écran d'accueil</button>
<div class="p-gl">Onboarding dans l'app</div>
<button type="button" class="p-st"><span>4</span>Bienvenue</button>
<button type="button" class="p-st"><span>5</span>Compte</button>
<button type="button" class="p-st"><span>6</span>Couleur</button>
<button type="button" class="p-st"><span>7</span>Notifications</button>
<button type="button" class="p-st"><span>8</span>Rythme</button>
<button type="button" class="p-st"><span>9</span>Connexion à Claude</button>
<button type="button" class="p-st"><span>10</span>Autorisation</button>
<button type="button" class="p-st"><span>11</span>Vérification</button>
<div class="p-gl">Au quotidien</div>
<button type="button" class="p-st"><span>12</span>Aujourd'hui</button>
<button type="button" class="p-st"><span>13</span>Bilan du soir</button>
<div id="p-cap" style="font-size:12px;color:var(--text-secondary);margin:14px 8px 0;line-height:1.5"></div>
</div>
<div>
<div class="p-app" id="p-app" data-theme="light"><div class="p-ph" id="p-ph"></div></div>
<div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px">
<button type="button" class="nav-btn" id="p-prev">Précédent</button>
<span id="p-cnt" style="font-size:13px;color:var(--text-secondary);min-width:48px;text-align:center">1 / 13</span>
<button type="button" class="nav-btn" id="p-next">Suivant</button>
</div>
</div>
</div>
</main>
<script>
const W=document.getElementById('p-app'),PH=document.getElementById('p-ph'),CAP=document.getElementById('p-cap'),CNT=document.getElementById('p-cnt');
const P=[["#007AFF","#0A84FF"],["#5856D6","#5E5CE6"],["#AF52DE","#BF5AF2"],["#FF2D55","#FF375F"],["#FF3B30","#FF453A"],["#FF9500","#FF9F0A"],["#FFCC00","#FFD60A"],["#34C759","#30D158"],["#00C7BE","#63E6E2"],["#32ADE6","#64D2FF"],["#8E8E93","#98989D"]];
const LV=['Un seul rappel, à l’heure prévue','Un rappel, puis une relance 15 min après','Deux relances, toutes les 15 min','Relance toutes les 15 min jusqu’à ce que ce soit coché'];
const META=['Ouverte dans Safari depuis un lien partagé.','Obligatoire sur iPhone pour recevoir des notifications. Touche l’icône Partager en bas.','À partir d’ici, tout se passe dans l’app installée.','Langue détectée automatiquement, modifiable.','Face ID ou code à 6 chiffres par email, jamais de lien.','Le texte coloré est assombri automatiquement s’il devient illisible.','Permission demandée au tap, puis notification de test. Essaie aussi « Refuser ».','Insistance à 2 par défaut, relances réservées aux tâches prioritaires.','Les instructions changent selon le plan Claude.','Page ouverte par Claude dans un navigateur : il faut se reconnecter.','Chaque outil est vérifié, avec la marche à suivre s’il manque.','Coche des tâches, annule l’import, tape Entrée dans le champ du bas.','Reporter ou supprimer ce qui reste avant de fermer la journée.'];
const st={s:0,ci:0,custom:null,dark:false,inst:0,lang:0,acct:0,alert:0,notif:null,test:false,lvl:2,prio:true,plan:1,copied:false,auth:0,skip:false,ver:0,undo:false,toast:'',rep:{},ended:false,
tasks:[{t:'Répondre à Sarah',m:'Gmail',tm:'10:30',ic:'mail',p:1,c:1,d:0},{t:'Slides de la démo',m:'1 sur 3',ic:'subtask',c:0,d:0},{t:'Valider la PR #12',m:'Slack',ic:'brand-slack',c:1,d:0},{t:'Envoyer le devis signé',m:'Gmail',ic:'mail',c:1,d:0},{t:'Appeler le comptable',m:'Ajoutée à la main',tm:'16:30',ic:'pencil',c:0,d:0},{t:'Relire le devis Dupont',m:'Gmail',ic:'mail',c:1,d:1}]};
let T;
const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const lum=c=>c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[0.2126,0.7152,0.0722][i],0);
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05)};
function adjust(hex,dark){let c=rgb(hex);const bg=dark?[28,28,30]:[255,255,255],t=dark?[255,255,255]:[0,0,0];let n=0;while(ratio(c,bg)<3&&n<60){c=c.map((v,i)=>Math.round(v+(t[i]-v)*0.06));n++}return {hex:'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase(),changed:n>0}}
function applyAcc(){const base=(st.custom||P[st.ci][st.dark?1:0]).toUpperCase();const a=adjust(base,st.dark);W.style.setProperty('--acc',base);W.style.setProperty('--acct',a.hex);W.style.setProperty('--onacc',ratio(rgb(base),[255,255,255])>=2?'#fff':'#000');W.dataset.theme=st.dark?'dark':'light';const n=document.getElementById('p-note');if(n)n.textContent=a.changed?('Texte ajusté pour rester lisible : '+a.hex):'Contraste correct';document.querySelectorAll('.p-sw').forEach(s=>{s.style.outline=(!st.custom&&+s.dataset.a.split(':')[1]===st.ci)?'2px solid var(--tx)':'none'})}
const ic=(n,s='')=>`<i class="ti ti-${n}" style="${s}" aria-hidden="true"></i>`;
const sb=()=>`<div class="p-sb"><span>9:41</span><span>${ic('antenna-bars-5')} ${ic('wifi')} ${ic('battery-4')}</span></div>`;
const dots=n=>`<div class="p-dots">${[0,1,2,3,4,5,6].map(i=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>`;
const logo=sz=>`<div style="width:${sz}px;height:${sz}px;border-radius:${Math.round(sz*0.23)}px;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none">${ic('checks',`font-size:${Math.round(sz*0.5)}px;color:var(--onacc)`)}</div>`;
const ring=(d,t,sz)=>{const c=94.25,v=t?c*d/t:0;return `<svg width="${sz}" height="${sz}" viewBox="0 0 36 36" aria-hidden="true" style="flex:none"><circle cx="18" cy="18" r="15" fill="none" style="stroke:var(--sep)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" style="stroke:var(--acc)" stroke-width="4" stroke-dasharray="${v.toFixed(2)} ${c}" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg>`};
const saf=hl=>`<div style="flex:none;background:var(--card);border-top:0.5px solid var(--sep);padding:8px 14px 22px"><div style="background:var(--fill);border-radius:10px;padding:7px;text-align:center;font-size:12px">${ic('lock','font-size:11px')} taskly.vercel.app</div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 6px 0;font-size:20px;color:var(--acct)">${ic('chevron-left')}${ic('chevron-right','color:var(--sep)')}<span data-a="share" style="cursor:pointer;display:flex;padding:2px 5px;border-radius:8px;${hl?'background:var(--acc);color:var(--onacc)':''}">${ic('share-2')}</span>${ic('book')}${ic('copy')}</div></div>`;
const num=k=>`<span style="width:22px;height:22px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:none">${k}</span>`;
const S=[
()=>`${sb()}<div class="p-body" style="padding-top:28px;gap:14px">${logo(60)}<div class="p-lt" style="font-size:28px">Ta journée,<br>triée par Claude</div><div class="p-mt" style="font-size:14px;line-height:1.5">Taskly transforme tes mails, ton agenda et tes messages en une checklist claire, avec de vrais rappels.</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">${[['mail','Claude lit tes mails et ton agenda'],['bell','Des rappels qui arrivent à l’heure'],['shield-check','Open source, tes données restent à toi']].map(([i,t])=>`<div style="display:flex;gap:10px;align-items:center;font-size:13px">${ic(i,'font-size:18px;color:var(--acct)')}${t}</div>`).join('')}</div><div style="margin-top:auto;padding-bottom:12px"><button type="button" class="p-b" data-a="next">${ic('download')} Installer sur l’iPhone</button><div class="p-mt" style="text-align:center;margin-top:8px">Gratuit · fonctionne avec Claude</div></div></div>${saf(false)}`,
()=>{let h=`${sb()}<div class="p-body" style="padding-top:24px;gap:12px"><div class="p-lt">Installe Taskly</div><div class="p-mt" style="font-size:14px">Sur iPhone, les notifications ne marchent qu’une fois l’app ajoutée à l’écran d’accueil.</div><div class="p-grp" style="margin-top:6px">${[['share-2','Touche Partager en bas'],['square-plus','Choisis « Sur l’écran d’accueil »'],['check','Touche « Ajouter »']].map(([i,t],k)=>`<div class="p-row">${num(k+1)}<span style="flex:1">${t}</span>${ic(i,'font-size:18px;color:var(--acct)')}</div>`).join('')}</div>${st.inst===0?`<div style="margin-top:auto;align-self:center;background:var(--acc);color:var(--onacc);font-size:12px;padding:6px 10px;border-radius:8px;margin-bottom:8px">Touche Partager ${ic('arrow-down')}</div>`:''}</div>${saf(st.inst===0)}`;
if(st.inst===1)h+=`<div class="p-ov" style="align-items:flex-end"><div style="background:var(--bg);width:100%;border-radius:14px 14px 0 0;padding:14px 12px 26px"><div style="display:flex;gap:10px;align-items:center;padding:0 4px 12px">${logo(36)}<div><div style="font-weight:500">Taskly</div><div class="p-mt">taskly.vercel.app</div></div></div><div style="display:flex;gap:12px;padding:4px 6px 12px">${[['wifi','AirDrop','#007AFF'],['message','Messages','#34C759'],['mail','Mail','#007AFF'],['notes','Notes','#FFCC00']].map(([i,l,c])=>`<div style="text-align:center;font-size:11px;width:54px"><div style="width:48px;height:48px;border-radius:12px;background:${c};display:flex;align-items:center;justify-content:center;margin:0 auto 4px">${ic(i,'font-size:24px;color:#fff')}</div>${l}</div>`).join('')}</div><div class="p-grp">${[['copy','Copier'],['eyeglass','Ajouter à la liste de lecture'],['book','Ajouter un signet']].map(([i,t])=>`<div class="p-row"><span style="flex:1">${t}</span>${ic(i,'font-size:18px')}</div>`).join('')}<div class="p-row" data-a="addhome" style="cursor:pointer;background:color-mix(in srgb,var(--acc) 16%,var(--card))"><span style="flex:1;font-weight:500">Sur l’écran d’accueil</span>${ic('square-plus','font-size:18px;color:var(--acct)')}</div></div></div></div>`;
if(st.inst===2)h+=`<div class="p-ov" style="background:var(--bg);flex-direction:column;align-items:stretch;justify-content:flex-start">${sb()}<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px"><span style="color:var(--acct)">Annuler</span><span style="font-weight:500">Écran d’accueil</span><span data-a="addok" style="color:var(--acct);font-weight:500;cursor:pointer;background:color-mix(in srgb,var(--acc) 16%,transparent);padding:4px 8px;border-radius:8px">Ajouter</span></div><div style="padding:10px 16px"><div class="p-grp" style="display:flex;gap:12px;padding:12px;align-items:center">${logo(56)}<div style="flex:1"><div style="border-bottom:0.5px solid var(--sep);padding-bottom:6px;font-size:15px">Taskly</div><div class="p-mt" style="padding-top:6px">taskly.vercel.app</div></div></div><div class="p-mt" style="padding:10px 4px">Une icône sera ajoutée à ton écran d’accueil pour accéder rapidement à ce site web.</div></div></div>`;
return h},

switch(a){case'next':go(st.s+1);break;case'share':st.inst=1;render();break;case'addhome':st.inst=2;render();break;case'addok':go(2);break;

case'sw':st.ci=n;st.custom=null;applyAcc();break;case'th':st.dark=n===1;render();break;
case'ask':st.alert=1;render();break;case'allow':st.alert=0;st.notif='granted';render();break;case'deny':st.alert=0;st.notif='denied';render();break;case'opensettings':st.notif=null;render();break;case'test':banner();break;
case'prio':st.prio=!st.prio;render();break;case'pl':st.plan=n;st.copied=false;render();break;case'copy':st.copied=true;render();break;case'later':st.skip=true;go(10);break;
case'auth':faceId(()=>{st.auth=1;render()});break;case'allow2':st.skip=false;go(10);break;case'rever':st.ver=0;render();break;
case'undo':st.undo=!st.undo;render();break;case'chk':st.tasks[n].d=st.tasks[n].d?0:1;render();break;case'rep':st.rep[n]='Reporté à demain';render();break;case'del':st.rep[n]='Supprimée';render();break;case'end':st.ended=true;render();break}});
PH.addEventListener('input',e=>{if(e.target.id==='p-col'){st.custom=e.target.value;applyAcc()}if(e.target.id==='p-lvl'){st.lvl=+e.target.value;document.getElementById('p-lvt').textContent=st.lvl+' · '+LV[st.lvl-1]}});
PH.addEventListener('keydown',e=>{if(e.target.id!=='p-qa'||e.key!=='Enter')return;let s=e.target.value.trim()||e.target.placeholder,when=false,tm='';if(/\bdemain\b/i.test(s)){when=true;s=s.replace(/\s*\bdemain\b\s*/i,' ')}const m=s.match(/\b(\d{1,2})\s*h\s*(\d{2})?/i);if(m){tm=m[1].padStart(2,'0')+':'+(m[2]||'00');s=s.replace(m[0],' ')}s=s.replace(/\s+/g,' ').trim();s=s.charAt(0).toUpperCase()+s.slice(1);if(!s)return;if(when){st.toast=`« ${s} » ajoutée pour demain${tm?' à '+tm:''}`}else{st.tasks.splice(st.tasks.length-1,0,{t:s,m:'Ajoutée à la main',tm,ic:'pencil',c:0,d:0});st.toast=`« ${s} » ajoutée${tm?' à '+tm:''}`}render();setTimeout(()=>{st.toast='';if(st.s===11)render()},2200)});
document.querySelectorAll('.p-st').forEach((b,i)=>b.addEventListener('click',()=>go(i)));
document.getElementById('p-prev').addEventListener('click',()=>go(st.s-1));
document.getElementById('p-next').addEventListener('click',()=>go(st.s+1));
render();
</script>
